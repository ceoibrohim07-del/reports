<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Система Отчётов</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap');

:root {
  --bg: #f5f3ee;
  --surface: #ffffff;
  --surface2: #f0ede6;
  --border: #e0dbd0;
  --text: #1a1814;
  --muted: #8a8478;
  --accent: #c8402a;
  --accent2: #2a6ec8;
  --green: #2a8a5a;
  --shadow: 0 2px 12px rgba(26,24,20,0.08);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:'DM Mono',monospace; min-height:100vh; }
.app { display:flex; flex-direction:column; min-height:100vh; }
.topbar { background:var(--text); color:var(--bg); padding:14px 32px; display:flex; align-items:center; justify-content:space-between; }
.topbar-logo { font-family:'Syne',sans-serif; font-size:13px; font-weight:800; letter-spacing:0.2em; text-transform:uppercase; }
.topbar-logo span { color:#c8402a; }
.topbar-right { display:flex; align-items:center; gap:16px; }
.topbar-user { font-size:11px; color:rgba(245,243,238,0.5); }
.topbar-user strong { color:#f5f3ee; }
.logout-btn { font-family:'DM Mono',monospace; font-size:11px; background:none; border:1px solid rgba(245,243,238,0.2); color:rgba(245,243,238,0.6); padding:6px 14px; cursor:pointer; border-radius:3px; transition:all 0.2s; }
.logout-btn:hover { border-color:#c8402a; color:#c8402a; }
.main { flex:1; padding:40px 32px; max-width:860px; margin:0 auto; width:100%; }
.screen { display:none; animation:fadeUp 0.25s ease; }
.screen.active { display:block; }
@keyframes fadeUp { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

/* LOGIN */
.login-wrap { max-width:500px; margin:0 auto; padding-top:20px; }
.login-title { font-family:'Syne',sans-serif; font-size:36px; font-weight:800; line-height:1.1; margin-bottom:6px; }
.login-sub { color:var(--muted); font-size:12px; margin-bottom:36px; }
.section-label { font-size:10px; letter-spacing:0.2em; text-transform:uppercase; color:var(--muted); margin-bottom:10px; padding-bottom:6px; border-bottom:1px solid var(--border); }
.user-grid { display:grid; gap:8px; margin-bottom:8px; }
.user-card { background:var(--surface); border:1.5px solid var(--border); border-radius:6px; padding:14px 18px; cursor:pointer; display:flex; align-items:center; gap:14px; transition:all 0.15s; }
.user-card:hover { border-color:var(--text); }
.user-card.selected { border-color:var(--accent); background:rgba(200,64,42,0.04); }
.user-card.curator-card { border-left:4px solid var(--accent); }
.user-card.worker-card  { border-left:4px solid var(--accent2); }
.card-avatar { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Syne',sans-serif; font-weight:800; font-size:11px; flex-shrink:0; }
.curator-card .card-avatar { background:rgba(200,64,42,0.12); color:var(--accent); }
.worker-card  .card-avatar { background:rgba(42,110,200,0.1);  color:var(--accent2); }
.card-name { font-size:13px; font-weight:500; }
.card-meta { font-size:10px; color:var(--muted); margin-top:2px; }
.pw-section { margin-top:16px; }
.field { margin-bottom:16px; }
label { display:block; font-size:10px; letter-spacing:0.15em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
input, textarea { width:100%; background:var(--surface); border:1.5px solid var(--border); border-radius:6px; color:var(--text); font-family:'DM Mono',monospace; font-size:14px; padding:11px 14px; outline:none; transition:border-color 0.15s; }
input:focus, textarea:focus { border-color:var(--text); }
textarea { min-height:160px; resize:vertical; }
.error-msg { background:rgba(200,64,42,0.08); border:1px solid rgba(200,64,42,0.25); color:var(--accent); font-size:11px; padding:10px 14px; border-radius:4px; margin-bottom:14px; display:none; }
.btn { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; background:var(--text); color:var(--bg); font-family:'Syne',sans-serif; font-size:12px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; border:none; border-radius:6px; padding:14px; cursor:pointer; transition:all 0.15s; }
.btn:hover { background:var(--accent); }
.btn:disabled { opacity:0.5; cursor:not-allowed; }
.btn.ghost { background:transparent; color:var(--muted); border:1.5px solid var(--border); margin-top:8px; font-family:'DM Mono',monospace; font-size:11px; }
.btn.ghost:hover { border-color:var(--text); color:var(--text); background:transparent; }
.btn.danger { background:var(--accent); }
.btn.sm { width:auto; padding:9px 18px; font-size:10px; }
.spinner { display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,0.3); border-top-color:#fff; border-radius:50%; animation:spin 0.7s linear infinite; }
@keyframes spin { to{transform:rotate(360deg)} }

/* WORKER */
.page-title { font-family:'Syne',sans-serif; font-size:28px; font-weight:800; margin-bottom:4px; }
.page-date  { font-size:11px; color:var(--muted); margin-bottom:32px; }
.already-done { background:var(--surface); border:1.5px solid #b8e8ce; border-radius:8px; padding:24px; margin-bottom:20px; }
.already-done h3 { color:var(--green); font-size:13px; margin-bottom:10px; }
.already-done p  { font-size:12px; color:var(--muted); line-height:1.6; white-space:pre-wrap; }
.success-banner { background:rgba(42,138,90,0.08); border:1px solid rgba(42,138,90,0.25); border-radius:6px; padding:20px; text-align:center; margin-bottom:20px; }
.success-banner .tick { font-size:28px; margin-bottom:6px; }
.success-banner p { font-size:12px; color:var(--green); }

/* CURATOR */
.curator-tabs { display:flex; gap:4px; background:var(--surface2); border-radius:8px; padding:4px; margin-bottom:32px; width:fit-content; }
.tab-btn { font-family:'DM Mono',monospace; font-size:11px; background:none; border:none; padding:8px 18px; border-radius:6px; cursor:pointer; color:var(--muted); transition:all 0.15s; }
.tab-btn.active { background:var(--surface); color:var(--text); font-weight:500; box-shadow:var(--shadow); }
.stats-row { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:28px; }
.stat-card { background:var(--surface); border:1.5px solid var(--border); border-radius:8px; padding:18px 20px; }
.stat-num { font-family:'Syne',sans-serif; font-size:32px; font-weight:800; line-height:1; margin-bottom:4px; }
.stat-lbl { font-size:10px; color:var(--muted); letter-spacing:0.1em; text-transform:uppercase; }
.report-card { background:var(--surface); border:1.5px solid var(--border); border-radius:8px; margin-bottom:10px; overflow:hidden; }
.report-head { display:flex; align-items:center; gap:12px; padding:14px 18px; cursor:pointer; }
.dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.dot.done { background:var(--green); }
.dot.miss { background:var(--accent); }
.rname { font-size:13px; font-weight:500; flex:1; }
.rtime { font-size:10px; color:var(--muted); }
.chev { font-size:10px; color:var(--muted); transition:transform 0.2s; }
.chev.open { transform:rotate(180deg); }
.report-body { display:none; padding:0 18px 18px; border-top:1px solid var(--border); }
.report-body.open { display:block; }
.report-body-text { font-size:13px; line-height:1.7; padding-top:14px; white-space:pre-wrap; }
.no-report-txt { font-size:12px; color:var(--muted); padding-top:14px; font-style:italic; }
.history-filters { display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
.filter-select { font-family:'DM Mono',monospace; font-size:11px; background:var(--surface); border:1.5px solid var(--border); border-radius:6px; padding:8px 12px; color:var(--text); outline:none; cursor:pointer; }
.history-table { width:100%; border-collapse:collapse; }
.history-table th { font-size:10px; text-transform:uppercase; letter-spacing:0.1em; color:var(--muted); text-align:left; padding:10px 14px; border-bottom:1.5px solid var(--border); }
.history-table td { font-size:12px; padding:12px 14px; border-bottom:1px solid var(--border); vertical-align:top; }
.history-table tr:hover td { background:var(--surface2); }
.badge { display:inline-block; font-size:10px; padding:3px 8px; border-radius:3px; font-weight:500; }
.badge.done { background:rgba(42,138,90,0.1); color:var(--green); }
.badge.miss { background:rgba(200,64,42,0.1); color:var(--accent); }
.history-entry { max-width:300px; font-size:11px; line-height:1.5; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.reset-bar { display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; }
.reset-bar h2 { font-family:'Syne',sans-serif; font-size:18px; font-weight:700; }
.loading-box { text-align:center; padding:40px; color:var(--muted); font-size:12px; }
@media(max-width:600px){ .main{padding:24px 16px} .topbar{padding:12px 16px} .stat-num{font-size:24px} }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="topbar-logo">Отчёты <span>//</span> Система</div>
    <div class="topbar-right">
      <div class="topbar-user" id="topbar-user" style="display:none"></div>
      <button class="logout-btn" id="logout-btn" onclick="logout()" style="display:none">Выйти</button>
    </div>
  </div>

  <div class="main">

    <!-- LOGIN -->
    <div class="screen active" id="screen-login">
      <div class="login-wrap">
        <div class="login-title">Войдите<br>в систему</div>
        <div class="login-sub">Выберите профиль и введите пароль</div>
        <div class="section-label">Кураторы</div>
        <div class="user-grid" id="curator-list"></div>
        <div class="section-label" style="margin-top:20px">Рабочие</div>
        <div class="user-grid" id="worker-list"></div>
        <div class="pw-section" id="pw-section" style="display:none">
          <div class="field" style="margin-top:16px">
            <label>Пароль</label>
            <input type="password" id="pw-input" placeholder="Введите пароль..." />
          </div>
          <div class="error-msg" id="login-err">Неверный пароль</div>
          <button class="btn" onclick="doLogin()">Войти</button>
          <button class="btn ghost" onclick="cancelLogin()">Отмена</button>
        </div>
      </div>
    </div>

    <!-- WORKER -->
    <div class="screen" id="screen-worker">
      <div class="page-title" id="w-title"></div>
      <div class="page-date"  id="w-date"></div>
      <div id="w-form">
        <div class="field">
          <label>Что сделал сегодня?</label>
          <textarea id="w-text" placeholder="Опиши подробно что было сделано за день..."></textarea>
        </div>
        <div class="error-msg" id="w-err">Поле не может быть пустым</div>
        <button class="btn" id="w-submit-btn" onclick="submitReport()">Отправить отчёт →</button>
      </div>
      <div id="w-done" style="display:none">
        <div class="success-banner"><div class="tick">✓</div><p>Отчёт принят. Куратор получит его вместе с остальными.</p></div>
        <div class="already-done"><h3>Твой отчёт за сегодня:</h3><p id="w-done-text"></p></div>
        <button class="btn ghost" onclick="logout()">Выйти из системы</button>
      </div>
    </div>

    <!-- CURATOR -->
    <div class="screen" id="screen-curator">
      <div style="margin-bottom:28px">
        <div class="page-title" id="c-title"></div>
        <div class="page-date"  id="c-date"></div>
      </div>
      <div class="curator-tabs">
        <button class="tab-btn active" onclick="switchTab('today')">Сегодня</button>
        <button class="tab-btn"        onclick="switchTab('history')">История 30 дней</button>
      </div>
      <div id="tab-today">
        <div class="stats-row" id="c-stats"></div>
        <div id="c-reports"></div>
      </div>
      <div id="tab-history" style="display:none">
        <div class="reset-bar">
          <h2>История за 30 дней</h2>
        </div>
        <div class="history-filters">
          <select class="filter-select" id="hist-worker" onchange="renderHistory()"><option value="">Все рабочие</option></select>
          <select class="filter-select" id="hist-status" onchange="renderHistory()">
            <option value="">Все статусы</option>
            <option value="done">Сдал</option>
            <option value="miss">Не сдал</option>
          </select>
        </div>
        <div style="overflow-x:auto">
          <table class="history-table">
            <thead><tr><th>Дата</th><th>Рабочий</th><th>Статус</th><th>Отчёт</th></tr></thead>
            <tbody id="hist-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
https://script.google.com/macros/s/AKfycbyumtc5OrYXgiltiFhkSexcRtKJmPJPpBMlcQwxhfUjhUhhNBW4TEUCfPuHJKGhHTEInA/exec

const CURATORS = [
  { id:'c1', name:'Karimov Ibrohim',    initials:'K.I', password:'kur1pass' },
  { id:'c2', name:'Ismailov Mustaqim',  initials:'I.M', password:'kur2pass' },
  { id:'c3', name:'Boltaboyev Shuhrat', initials:'B.S', password:'kur3pass' },
  { id:'c4', name:'Muhammedov Dilshod', initials:'M.D', password:'kur4pass' },
];

const WORKERS = [
  { id:'w1',  name:'Nigmanova Shaxlo',      initials:'N.S', curatorId:'c1', password:'ns001' },
  { id:'w2',  name:'Orzikulova Sevinch',     initials:'O.S', curatorId:'c1', password:'os002' },
  { id:'w3',  name:'Suleymanov Marlen',      initials:'S.M', curatorId:'c1', password:'sm003' },
  { id:'w4',  name:'Shodmonqulova Charos',   initials:'S.C', curatorId:'c1', password:'sc004' },
  { id:'w5',  name:'Saydazimov Sarvar',      initials:'S.S', curatorId:'c1', password:'ss005' },
  { id:'w6',  name:'Xolmatov Muhammadsolix', initials:'X.M', curatorId:'c2', password:'xm006' },
  { id:'w7',  name:'Baxtiyorov Mahammadali', initials:'B.M', curatorId:'c2', password:'bm007' },
  { id:'w8',  name:'Samieva Nozima',         initials:'S.N', curatorId:'c2', password:'sn008' },
  { id:'w9',  name:'Murodjonova Nargizaxon', initials:'M.N', curatorId:'c2', password:'mn009' },
  { id:'w10', name:'Abduxalimov Nurshodbek', initials:'A.N', curatorId:'c2', password:'an010' },
  { id:'w11', name:'Baxtiyorov Yahyo',       initials:'B.Y', curatorId:'c3', password:'by011' },
  { id:'w12', name:'Elbaev Azamat',          initials:'E.A', curatorId:'c3', password:'ea012' },
  { id:'w13', name:'Isajanova Iroda',        initials:'I.I', curatorId:'c3', password:'ii013' },
  { id:'w14', name:'Xujaniyozov Xayrulla',   initials:'X.X', curatorId:'c4', password:'xx014' },
  { id:'w15', name:'Xoliqov Shoxjaxon',      initials:'X.S', curatorId:'c4', password:'xs015' },
  { id:'w16', name:'Kunduzov Shaxzodbek',    initials:'K.S', curatorId:'c4', password:'ks016' },
];

let currentUser  = null;
let selectedId   = null;
let todayReports = {};
let historyRows  = [];

function todayKey() {
  const d = new Date();
  const offset = d.getTimezoneOffset();
  const local = new Date(d.getTime() - offset * 60000);
  return local.toISOString().slice(0, 10);
}
function todayLabel() {
  return new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});
}
function getLast30Keys() {
  const keys=[];
  for(let i=0;i<30;i++){
    const d=new Date(); d.setDate(d.getDate()-i);
    keys.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`);
  }
  return keys;
}
function esc(str){ return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>'); }

// INIT
(function(){
  const cList=document.getElementById('curator-list');
  CURATORS.forEach(c=>cList.appendChild(makeCard(c,'curator')));
  const wList=document.getElementById('worker-list');
  WORKERS.forEach(w=>{
    const cur=CURATORS.find(c=>c.id===w.curatorId);
    wList.appendChild(makeCard(w,'worker',cur?cur.name:''));
  });
})();

function makeCard(user,role,curatorName){
  const div=document.createElement('div');
  div.className=`user-card ${role}-card`;
  div.id=`card-${user.id}`;
  div.innerHTML=`
    <div class="card-avatar">${user.initials}</div>
    <div class="card-info">
      <div class="card-name">${user.name}</div>
      <div class="card-meta">${role==='curator'?'Куратор':'Рабочий · '+curatorName}</div>
    </div>`;
  div.onclick=()=>selectCard(user.id);
  return div;
}

function selectCard(id){
  selectedId=id;
  document.querySelectorAll('.user-card').forEach(c=>c.classList.remove('selected'));
  document.getElementById(`card-${id}`).classList.add('selected');
  document.getElementById('pw-section').style.display='block';
  document.getElementById('pw-input').value='';
  document.getElementById('login-err').style.display='none';
  setTimeout(()=>document.getElementById('pw-input').focus(),50);
}
function cancelLogin(){
  selectedId=null;
  document.querySelectorAll('.user-card').forEach(c=>c.classList.remove('selected'));
  document.getElementById('pw-section').style.display='none';
}
document.getElementById('pw-input').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});

function doLogin(){
  const pw=document.getElementById('pw-input').value;
  const err=document.getElementById('login-err');
  let user=CURATORS.find(c=>c.id===selectedId&&c.password===pw);
  let role='curator';
  if(!user){user=WORKERS.find(w=>w.id===selectedId&&w.password===pw);role='worker';}
  if(!user){err.style.display='block';return;}
  err.style.display='none';
  currentUser={...user,role};
  document.getElementById('topbar-user').style.display='block';
  document.getElementById('topbar-user').innerHTML=`Вошёл: <strong>${user.name}</strong>`;
  document.getElementById('logout-btn').style.display='block';
  if(role==='curator') showCurator();
  else showWorker();
}

function logout(){
  currentUser=null; selectedId=null; todayReports={}; historyRows=[];
  document.getElementById('topbar-user').style.display='none';
  document.getElementById('logout-btn').style.display='none';
  cancelLogin();
  showScreen('screen-login');
}
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// API
async function fetchSheets(curatorId){
  const res=await fetch(`${SCRIPT_URL}?curatorId=${curatorId}&t=${Date.now()}`);
  const json=await res.json();
  return json.rows||[];
}
async function postSheets(payload){
  const res=await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify(payload)});
  return await res.json();
}

// WORKER
async function showWorker(){
  document.getElementById('w-title').textContent=currentUser.name;
  document.getElementById('w-date').textContent=todayLabel();
  document.getElementById('w-form').style.display='block';
  document.getElementById('w-done').style.display='none';
  document.getElementById('w-text').value='';
  showScreen('screen-worker');
  const btn=document.getElementById('w-submit-btn');
  btn.disabled=true;
  btn.innerHTML='<span class="spinner"></span> Проверяем...';
  try{
    const rows=await fetchSheets(currentUser.curatorId);
    const today=todayKey();
    const existing=rows.find(r=>r['Рабочий ID']===currentUser.id&&String(r['Дата'])===today);
    if(existing){
      document.getElementById('w-form').style.display='none';
      document.getElementById('w-done').style.display='block';
      document.getElementById('w-done-text').textContent=existing['Отчёт'];
    } else {
      btn.disabled=false;
      btn.innerHTML='Отправить отчёт →';
    }
  }catch(e){
    btn.disabled=false;
    btn.innerHTML='Отправить отчёт →';
  }
}

async function submitReport(){
  const text=document.getElementById('w-text').value.trim();
  if(!text){document.getElementById('w-err').style.display='block';return;}
  document.getElementById('w-err').style.display='none';
  const btn=document.getElementById('w-submit-btn');
  btn.disabled=true;
  btn.innerHTML='<span class="spinner"></span> Отправляем...';
  const now=new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  try{
    const res=await postSheets({
      curatorId:currentUser.curatorId,
      workerId:currentUser.id,
      workerName:currentUser.name,
      date:todayKey(),
      time:now,
      text:text
    });
    if(res.status==='ok'){
      document.getElementById('w-form').style.display='none';
      document.getElementById('w-done').style.display='block';
      document.getElementById('w-done-text').textContent=text;
    } else {
      alert('Ошибка отправки. Попробуй ещё раз.');
      btn.disabled=false;
      btn.innerHTML='Отправить отчёт →';
    }
  }catch(e){
    alert('Нет соединения. Проверь интернет.');
    btn.disabled=false;
    btn.innerHTML='Отправить отчёт →';
  }
}

// CURATOR
async function showCurator(){
  document.getElementById('c-title').textContent=currentUser.name;
  document.getElementById('c-date').textContent=todayLabel();
  showScreen('screen-curator');
  switchTab('today');
}

function switchTab(tab){
  document.querySelectorAll('.tab-btn').forEach((b,i)=>{
    b.classList.toggle('active',(i===0&&tab==='today')||(i===1&&tab==='history'));
  });
  document.getElementById('tab-today').style.display=tab==='today'?'block':'none';
  document.getElementById('tab-history').style.display=tab==='history'?'block':'none';
  if(tab==='today') loadToday();
  if(tab==='history') loadHistory();
}

async function loadToday(){
  const myWorkers=WORKERS.filter(w=>w.curatorId===currentUser.id);
  document.getElementById('c-stats').innerHTML='<div class="loading-box">Загружаем данные...</div>';
  document.getElementById('c-reports').innerHTML='';
  try{
    const rows=await fetchSheets(currentUser.id);
    const today=todayKey();
    todayReports={};
    rows.filter(r=>{
      const d = new Date(r['Дата']);
      const offset = d.getTimezoneOffset();
      const local = new Date(d.getTime() - offset * 60000);
      return local.toISOString().slice(0,10) === today;
    }).forEach(r=>{
      todayReports[r['Рабочий ID']]={text:r['Отчёт'],time:r['Время']};
    });
    renderToday(myWorkers);
  }catch(e){
    document.getElementById('c-stats').innerHTML='<div class="loading-box" style="color:var(--accent)">Ошибка загрузки. Проверь соединение.</div>';
  }
}

function renderToday(myWorkers){
  const submitted=myWorkers.filter(w=>todayReports[w.id]);
  const missing=myWorkers.filter(w=>!todayReports[w.id]);
  document.getElementById('c-stats').innerHTML=`
    <div class="stat-card"><div class="stat-num">${myWorkers.length}</div><div class="stat-lbl">Рабочих</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--green)">${submitted.length}</div><div class="stat-lbl">Сдали</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--accent)">${missing.length}</div><div class="stat-lbl">Не сдали</div></div>`;
  const container=document.getElementById('c-reports');
  container.innerHTML='';
  myWorkers.forEach(w=>{
    const r=todayReports[w.id];
    const div=document.createElement('div');
    div.className='report-card';
    div.innerHTML=`
      <div class="report-head" onclick="toggleBody('rb-${w.id}','chev-${w.id}')">
        <div class="dot ${r?'done':'miss'}"></div>
        <div class="rname">${w.initials} · ${w.name}</div>
        <div class="rtime">${r?'✓ '+r.time:'Не сдал'}</div>
        <div class="chev" id="chev-${w.id}">▼</div>
      </div>
      <div class="report-body" id="rb-${w.id}">
        ${r?`<div class="report-body-text">${esc(r.text)}</div>`:`<div class="no-report-txt">Отчёт ещё не поступил.</div>`}
      </div>`;
    container.appendChild(div);
  });
}

function toggleBody(bodyId,chevId){
  const body=document.getElementById(bodyId);
  const chev=document.getElementById(chevId);
  const open=body.classList.toggle('open');
  if(chev)chev.classList.toggle('open',open);
}

async function loadHistory(){
  document.getElementById('hist-tbody').innerHTML='<tr><td colspan="4" class="loading-box">Загружаем историю...</td></tr>';
  const myWorkers=WORKERS.filter(w=>w.curatorId===currentUser.id);
  const sel=document.getElementById('hist-worker');
  sel.innerHTML='<option value="">Все рабочие</option>';
  myWorkers.forEach(w=>{
    const o=document.createElement('option');
    o.value=w.id; o.textContent=`${w.initials} · ${w.name}`;
    sel.appendChild(o);
  });
  try{
    historyRows=await fetchSheets(currentUser.id);
    renderHistory();
  }catch(e){
    document.getElementById('hist-tbody').innerHTML='<tr><td colspan="4" style="color:var(--accent);text-align:center;padding:24px">Ошибка загрузки</td></tr>';
  }
}

function renderHistory(){
  const myWorkers=WORKERS.filter(w=>w.curatorId===currentUser.id);
  const workerFilter=document.getElementById('hist-worker').value;
  const statusFilter=document.getElementById('hist-status').value;
  const last30=getLast30Keys();
  const tbody=document.getElementById('hist-tbody');
  tbody.innerHTML='';
  const lookup={};
  historyRows.forEach(r=>{
    const d = new Date(r['Дата']);
    const offset = d.getTimezoneOffset();
    const local = new Date(d.getTime() - offset * 60000);
    const dateKey = local.toISOString().slice(0,10);
    lookup[`${dateKey}_${r['Рабочий ID']}`]=r;
  });
  last30.forEach(dateKey=>{
    const dateLabel=new Date(dateKey+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
    myWorkers.forEach(w=>{
      if(workerFilter&&w.id!==workerFilter)return;
      const r=lookup[`${dateKey}_${w.id}`];
      const status=r?'done':'miss';
      if(statusFilter&&status!==statusFilter)return;
      if(!r&&dateKey===todayKey())return;
      const tr=document.createElement('tr');
      tr.innerHTML=`
        <td>${dateLabel}</td>
        <td>${w.initials} · ${w.name}</td>
        <td><span class="badge ${status}">${r?'Сдал':'Не сдал'}</span></td>
        <td><div class="history-entry">${r?esc(r['Отчёт']):'—'}</div></td>`;
      tbody.appendChild(tr);
    });
  });
  if(!tbody.children.length){
    tbody.innerHTML='<tr><td colspan="4" style="color:var(--muted);text-align:center;padding:24px">Нет данных</td></tr>';
  }
}
</script>
</body>
</html>
